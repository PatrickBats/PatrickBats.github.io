<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Patrick Batsell</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
            </div>
        </div>
    </nav>

    <main class="content" style="padding-top: 2rem; max-width: 1000px;">
        <section class="section" style="border-top: none;">
            <h2>Visitor Dashboard</h2>
            <button id="sign-in">Sign in with Google</button>
            <button id="sign-out" hidden>Sign out</button>
            <p id="auth-status" role="status">Sign in to view private visitor records.</p>
            <div id="private-controls" hidden>
                <label>Records <select id="record-source"><option value="new">New visits with IP addresses</option><option value="legacy">Historical visits (no IP addresses)</option></select></label>
                <p>Showing <span id="visitor-count">0</span> records on this page. Map shows this page only; locations are approximate.</p>
                <button id="refresh">Newest visits</button>
                <button id="next" disabled>Older visits</button>
            </div>
            <div class="dashboard-grid">
                <div id="visitor-map"></div>
                <div id="visit-log"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2025 Patrick Batsell</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="analytics-config.js"></script>
    <script src="visitors.js"></script>
</body>
</html>
